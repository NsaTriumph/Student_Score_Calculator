
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Score Calculator</h1>
        <p>Enter each student's scores to calculate their total and grade automatically.</p>

        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>CA 1 (10)</th>
                    <th>CA 2 (10)</th>
                    <th>CA 3 (10)</th>
                    <th>Exam (70)</th>
                    <th>Total (100)</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Student 1</td>
                    <td><input type="number" class="score ca1" min="0" max="10"></td>
                    <td><input type="number" class="score ca2" min="0" max="10"></td>
                    <td><input type="number" class="score ca3" min="0" max="10"></td>
                    <td><input type="number" class="score exam" min="0" max="70"></td>
                    <td class="total">-</td>
                    <td class="grade">-</td>
                </tr>

                <tr>
                    <td>Student 2</td>
                    <td><input type="number" class="score ca1" min="0" max="10"></td>
                    <td><input type="number" class="score ca2" min="0" max="10"></td>
                    <td><input type="number" class="score ca3" min="0" max="10"></td>
                    <td><input type="number" class="score exam" min="0" max="70"></td>
                    <td class="total">-</td>
                    <td class="grade">-</td>
                </tr>

                <tr>
                    <td>Student 3</td>
                    <td><input type="number" class="score ca1" min="0" max="10"></td>
                    <td><input type="number" class="score ca2" min="0" max="10"></td>
                    <td><input type="number" class="score ca3" min="0" max="10"></td>
                    <td><input type="number" class="score exam" min="0" max="70"></td>
                    <td class="total">-</td>
                    <td class="grade">-</td>
                </tr>

                <tr>
                    <td>Student 4</td>
                    <td><input type="number" class="score ca1" min="0" max="10"></td>
                    <td><input type="number" class="score ca2" min="0" max="10"></td>
                    <td><input type="number" class="score ca3" min="0" max="10"></td>
                    <td><input type="number" class="score exam" min="0" max="70"></td>
                    <td class="total">-</td>
                    <td class="grade">-</td>
                </tr>

                <tr>
                    <td>Student 5</td>
                    <td><input type="number" class="score ca1" min="0" max="10"></td>
                    <td><input type="number" class="score ca2" min="0" max="10"></td>
                    <td><input type="number" class="score ca3" min="0" max="10"></td>
                    <td><input type="number" class="score exam" min="0" max="70"></td>
                    <td class="total">-</td>
                    <td class="grade">-</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
